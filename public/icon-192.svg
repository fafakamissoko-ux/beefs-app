<svg width="192" height="192" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Fond App (Tailwind slate-950) avec coins "squircle" Apple -->
  <rect width="512" height="512" fill="#020617" rx="112" />

  <!-- Ambient Glows intensifiés -->
  <circle cx="100" cy="100" r="200" fill="#0891b2" opacity="0.25" filter="blur(50px)" />
  <circle cx="400" cy="400" r="150" fill="#06b6d4" opacity="0.20" filter="blur(40px)" />

  <!-- Starry Glass (Étoiles vectorielles plus denses et brillantes) -->
  <g fill="#ffffff">
    <circle cx="60" cy="120" r="2.5" opacity="0.9" />
    <circle cx="120" cy="300" r="1.5" opacity="0.6" />
    <circle cx="250" cy="60" r="3" opacity="1" />
    <circle cx="420" cy="150" r="2" opacity="0.8" />
    <circle cx="380" cy="380" r="2.5" opacity="0.9" />
    <circle cx="150" cy="450" r="2" opacity="0.7" />
    <circle cx="280" cy="420" r="2.5" opacity="0.8" />
    <circle cx="460" cy="90" r="1.5" opacity="0.5" />
    <circle cx="50" cy="400" r="3" opacity="0.7" />
    <circle cx="480" cy="280" r="2" opacity="0.9" />
  </g>

  <defs>
    <!-- Moteur de luminescence (Quadruple passe avec cœur blanc pur) -->
    <filter id="neon-glow-v2" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" floodColor="#ffffff" floodOpacity="0.9" />
      <feDropShadow dx="0" dy="0" stdDeviation="10" floodColor="#22d3ee" floodOpacity="1" />
      <feDropShadow dx="0" dy="0" stdDeviation="22" floodColor="#06b6d4" floodOpacity="0.85" />
      <feDropShadow dx="0" dy="0" stdDeviation="40" floodColor="#0891b2" floodOpacity="0.6" />
    </filter>
  </defs>

  <!-- Vecteur Éclair (Échelle 1.4x centrée) -->
  <path d="M298 24 L116 290 L228 290 L172 488 L396 192 L270 192 Z" fill="#ffffff" filter="url(#neon-glow-v2)" />
</svg>
